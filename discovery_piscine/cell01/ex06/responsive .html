<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Responsive Fullscreen Table</title>
        <style>
            
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100vw;
                height: 100vh;
                overflow: hidden; 
            }

            .table {
                width: 100%;
                height: 100%;
                border-collapse: collapse;
                table-layout: fixed; 
            }

            .table th {
                width: 50%;
                border: 1px solid black;
                text-align: left;
                vertical-align: top;
                padding: 2vw;
                font-size: clamp(16px, 4vw, 40px);
            }

            .one {
                background-color: #5fb4a9;
            }

            .two {
                background-color: #69ca89;
            }
        </style>
    </head>
    <body>
        <table class="table">
            <tbody>
                <tr>
                    <th class="one">First cell</th>
                    <th class="two">Second cell</th>
                </tr>
            </tbody>
        </table>
    </body>
</html>
